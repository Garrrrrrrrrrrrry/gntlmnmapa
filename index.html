<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chacanamy 1111 — простая страница</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #f5f7ff, #e8f2ff);
        color: #1f2937;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      p {
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="badge">GitHub Pages</span>
        <h1>Привет! Это простая HTML-страница проекта Chacanamy</h1>
        <p>Эта страница создана как стартовый пример статичного сайта в репозитории.</p>
        <p>Сейчас она доступна как часть проекта и может быть легко расширена: добавить контакты, описание, ссылки или форму.</p>
      </section>
    </main>
  </body>
</html>
